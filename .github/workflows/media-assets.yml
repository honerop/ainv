name: Keyless media assets

on:
  push:
    paths:
      - tools/media_assets.py
      - tests/test_media_assets.py
      - tests/test_project_inspect.py
      - tools/project_inspect.py
      - examples/commons-image.json
      - .github/workflows/media-assets.yml
      - flake.nix
  pull_request:
  workflow_dispatch:

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline Wikimedia Commons adapter tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify example JSON
        run: python -m json.tool examples/commons-image.json > /dev/null
