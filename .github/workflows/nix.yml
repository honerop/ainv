name: Nix run verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v17
      - name: Verify Nix flake checks (compiles Babel and renders MP4)
        run: nix flake check -L
      - name: Build standalone Babel program wrapper
        run: nix build .#default -L
      - name: Verify custom JSON MP4 export using Babel
        run: |
          nix run . -- examples/babel-smoke.json smoke.mp4
          test -s smoke.mp4
          test -s smoke.srt
          nix develop -c ffprobe -v error -show_entries stream=codec_name -of csv=p=0 smoke.mp4 | grep -q h264
