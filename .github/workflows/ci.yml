name: Babel video smoke test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check out Babel compiler
        run: git clone --depth 1 https://github.com/honerop/babel.git /tmp/babel
      - name: Generate example video using Babel only
        env:
          BABEL_VIDEO_SPEC: examples/explainer.json
          BABEL_VIDEO_OUTPUT: explainer.y4m
        run: cargo run --quiet --manifest-path /tmp/babel/Cargo.toml -- run render.babel
      - name: Verify Y4M video using Babel only
        run: cargo run --quiet --manifest-path /tmp/babel/Cargo.toml -- run tests/smoke.babel
      - name: Generate high quality vector animation in Babel
        env:
          BABEL_VIDEO_SPEC: examples/showcase.json
          BABEL_VIDEO_PREVIEW: showcase.svg
        run: cargo run --quiet --manifest-path /tmp/babel/Cargo.toml -- run preview.babel
      - name: Verify vector animation in Babel
        run: cargo run --quiet --manifest-path /tmp/babel/Cargo.toml -- run tests/preview_smoke.babel
