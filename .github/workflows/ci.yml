name: Ain video smoke test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check out Ain compiler
        run: git clone --depth 1 https://github.com/honerop/ain.git /tmp/ain
      - name: Generate example video using Ain only
        env:
          AIN_VIDEO_SPEC: examples/explainer.json
          AIN_VIDEO_OUTPUT: explainer.y4m
        run: cargo run --quiet --manifest-path /tmp/ain/Cargo.toml -- run render.ain
      - name: Verify Y4M video using Ain only
        run: cargo run --quiet --manifest-path /tmp/ain/Cargo.toml -- run tests/smoke.ain
      - name: Generate high quality vector animation in Ain
        env:
          AIN_VIDEO_SPEC: examples/showcase.json
          AIN_VIDEO_PREVIEW: showcase.svg
        run: cargo run --quiet --manifest-path /tmp/ain/Cargo.toml -- run preview.ain
      - name: Verify vector animation in Ain
        run: cargo run --quiet --manifest-path /tmp/ain/Cargo.toml -- run tests/preview_smoke.ain

  mp4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install OpenH264 assembler and fonts
        run: sudo apt-get update && sudo apt-get install -y nasm fonts-dejavu-core
      - name: Compile native codec tests
        run: cargo test --manifest-path native/Cargo.toml
      - name: Render and verify playable H264 MP4 without ffmpeg
        run: cargo run --release --manifest-path native/Cargo.toml -- examples/mp4-smoke.json smoke.mp4
      - name: Check real MP4 file type and nonzero size
        run: |
          test -s smoke.mp4
          od -An -tx1 -N 8 smoke.mp4 | grep -q '66 74 79 70'
