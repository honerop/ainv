name: Babel Nix native build

on:
  pull_request:
  push:
    paths:
      - flake.nix
      - flake.lock
      - director.babel
      - .github/workflows/ain-nix.yml
  workflow_dispatch:

jobs:
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v17
      - name: Resolve Babel compiler input
        run: |
          nix flake lock
          cat flake.lock
      - name: Compile Babel and render offline smoke MP4
        run: nix flake check -L
