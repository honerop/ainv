name: Render full Ain showcase MP4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - director.ain
      - examples/math-explainer.json
      - .github/workflows/render-showcase.yml

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v17
      - name: Render narrated mathematical explainer through Ain
        run: nix run .
      - name: Verify narrated MP4 and subtitle output
        run: |
          test -s showcase.mp4
          test -s showcase.srt
          file showcase.mp4 | grep -qi 'ISO Media'
      - name: Upload completed Ain-generated video
        uses: actions/upload-artifact@v4
        with:
          name: ainv-showcase-narrated-mp4
          path: |
            showcase.mp4
            showcase.srt
          if-no-files-found: error
          retention-days: 14
