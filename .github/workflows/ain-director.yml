name: Ain-native video director

on:
  push:
    paths:
      - director.ain
      - examples/ain-smoke.json
      - .github/workflows/ain-director.yml
  pull_request:
  workflow_dispatch:

jobs:
  ain-video:
    runs-on: ubuntu-latest
    env:
      AINV_DIRNAME: /usr/bin/dirname
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch Ain compiler
        run: git clone --depth 1 https://github.com/honerop/ain.git /tmp/ain
      - name: Check that director is valid Ain
        run: cargo run --quiet --manifest-path /tmp/ain/Cargo.toml -- check director.ain
      - name: Build Ain application
        run: cargo run --quiet --manifest-path /tmp/ain/Cargo.toml -- build director.ain -o /tmp/ainv
      - name: Install external video and graphics codecs
        run: sudo apt-get update && sudo apt-get install -y ffmpeg librsvg2-bin fonts-dejavu-core espeak-ng
      - name: Render a real 3-frame MP4 with Ain
        run: |
          set -euo pipefail
          export AINV_WORK="$(mktemp -d)"
          export AINV_RSVG="$(command -v rsvg-convert)"
          export AINV_FFMPEG="$(command -v ffmpeg)"
          export AINV_FFPROBE="$(command -v ffprobe)"
          export AINV_EDGE_TTS=/bin/false
          export AIN_PROCESS_TIMEOUT_MS=180000
          /tmp/ainv examples/ain-smoke.json smoke-ain.mp4
          test -s smoke-ain.mp4
          ffprobe -v error -show_entries stream=codec_name,width,height -of json smoke-ain.mp4
          test -s smoke-ain.srt
      - name: Verify Edge TTS integration and AAC audio alignment without network
        run: |
          set -euo pipefail
          cat > /tmp/mock-edge-tts <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          output=""
          while [ "$#" -gt 0 ]; do
            if [ "$1" = "--write-media" ]; then
              output="$2"
              shift 2
            else
              shift
            fi
          done
          test -n "$output"
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "sine=frequency=440:duration=1.2" "$output"
          EOF
          chmod +x /tmp/mock-edge-tts
          export AINV_WORK="$(mktemp -d)"
          export AINV_RSVG="$(command -v rsvg-convert)"
          export AINV_FFMPEG="$(command -v ffmpeg)"
          export AINV_FFPROBE="$(command -v ffprobe)"
          export AINV_EDGE_TTS=/tmp/mock-edge-tts
          export AIN_PROCESS_TIMEOUT_MS=180000
          /tmp/ainv examples/ain-voice-smoke.json voice-smoke.mp4
          test -s voice-smoke.mp4
          test -s voice-smoke.srt
          ffprobe -v error -show_entries stream=codec_type -of csv=p=0 voice-smoke.mp4 | grep -qx audio
      - name: Verify Ain offline speech fallback when Edge is blocked
        run: |
          set -euo pipefail
          export AINV_WORK="$(mktemp -d)"
          export AINV_RSVG="$(command -v rsvg-convert)"
          export AINV_FFMPEG="$(command -v ffmpeg)"
          export AINV_FFPROBE="$(command -v ffprobe)"
          export AINV_EDGE_TTS=/bin/false
          export AINV_ESPEAK="$(command -v espeak-ng)"
          export AIN_PROCESS_TIMEOUT_MS=180000
          /tmp/ainv examples/ain-voice-smoke.json fallback.mp4
          test -s fallback.mp4
          ffprobe -v error -show_entries stream=codec_type -of csv=p=0 fallback.mp4 | grep -qx audio
      - name: Generate general-purpose photo, footage, voice, and music fixtures
        run: |
          set -euo pipefail
          mkdir -p examples/fixtures
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "color=c=red:s=96x96" -frames:v 1 examples/fixtures/still.png
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "testsrc2=s=96x64:r=4:d=2" -c:v mpeg4 examples/fixtures/clip.mp4
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "sine=frequency=550:duration=0.7" examples/fixtures/sound.wav
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "sine=frequency=190:duration=2" examples/fixtures/music.wav
      - name: Render image and video montage with audio and music using Ain
        run: |
          set -euo pipefail
          export AINV_WORK="$(mktemp -d)"
          export AINV_RSVG="$(command -v rsvg-convert)"
          export AINV_FFMPEG="$(command -v ffmpeg)"
          export AINV_FFPROBE="$(command -v ffprobe)"
          export AINV_EDGE_TTS=/bin/false
          export AINV_ESPEAK="$(command -v espeak-ng)"
          export AIN_PROCESS_TIMEOUT_MS=180000
          /tmp/ainv examples/general-media-smoke.json montage.mp4
          test -s montage.mp4
          test -s montage.srt
          ffprobe -v error -show_entries stream=codec_type -of csv=p=0 montage.mp4 | grep -qx audio
          ffprobe -v error -show_entries stream=width,height -of csv=p=0 montage.mp4 | grep -qx '160,96'
      - name: Render reduced-size default general showcase and decimal math showcase
        run: |
          set -euo pipefail
          export AINV_WORK="$(mktemp -d)"
          export AINV_RSVG="$(command -v rsvg-convert)"
          export AINV_FFMPEG="$(command -v ffmpeg)"
          export AINV_FFPROBE="$(command -v ffprobe)"
          export AINV_EDGE_TTS=/bin/false
          export AINV_ESPEAK="$(command -v espeak-ng)"
          export AINV_SKIP_TTS=1
          export AIN_PROCESS_TIMEOUT_MS=180000
          jq '.width=160 | .height=96 | .fps=1 | .scenes |= map(.frames=1 | del(.narration))' examples/general-showcase.json > examples/general-short-regression.json
          jq '.width=160 | .height=96 | .fps=1 | .scenes |= map(.frames=1 | del(.narration))' examples/math-explainer.json > examples/math-short-regression.json
          /tmp/ainv examples/general-short-regression.json general-short.mp4
          test -s general-short.mp4
          rm -rf "$AINV_WORK"
          export AINV_WORK="$(mktemp -d)"
          /tmp/ainv examples/math-short-regression.json math-short.mp4
          test -s math-short.mp4
