name: Ain-native video director

on:
  push:
    paths:
      - director.ain
      - examples/ain-smoke.json
      - .github/workflows/ain-director.yml
  pull_request:
  workflow_dispatch:

jobs:
  ain-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch Ain compiler
        run: git clone --depth 1 https://github.com/honerop/ain.git /tmp/ain
      - name: Check that director is valid Ain
        run: cargo run --quiet --manifest-path /tmp/ain/Cargo.toml -- check director.ain
      - name: Build Ain application
        run: cargo run --quiet --manifest-path /tmp/ain/Cargo.toml -- build director.ain -o /tmp/ainv
      - name: Install external video and graphics codecs
        run: sudo apt-get update && sudo apt-get install -y ffmpeg librsvg2-bin fonts-dejavu-core
      - name: Render a real 3-frame MP4 with Ain
        run: |
          set -euo pipefail
          export AINV_WORK="$(mktemp -d)"
          export AINV_RSVG="$(command -v rsvg-convert)"
          export AINV_FFMPEG="$(command -v ffmpeg)"
          export AINV_FFPROBE="$(command -v ffprobe)"
          export AINV_EDGE_TTS=/bin/false
          export AIN_PROCESS_TIMEOUT_MS=180000
          /tmp/ainv examples/ain-smoke.json smoke-ain.mp4
          test -s smoke-ain.mp4
          ffprobe -v error -show_entries stream=codec_name,width,height -of json smoke-ain.mp4
          test -s smoke-ain.srt
      - name: Verify Edge TTS integration and AAC audio alignment without network
        run: |
          set -euo pipefail
          cat > /tmp/mock-edge-tts <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          output=""
          while [ "$#" -gt 0 ]; do
            if [ "$1" = "--write-media" ]; then
              output="$2"
              shift 2
            else
              shift
            fi
          done
          test -n "$output"
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "sine=frequency=440:duration=1.2" "$output"
          EOF
          chmod +x /tmp/mock-edge-tts
          export AINV_WORK="$(mktemp -d)"
          export AINV_RSVG="$(command -v rsvg-convert)"
          export AINV_FFMPEG="$(command -v ffmpeg)"
          export AINV_FFPROBE="$(command -v ffprobe)"
          export AINV_EDGE_TTS=/tmp/mock-edge-tts
          export AIN_PROCESS_TIMEOUT_MS=180000
          /tmp/ainv examples/ain-voice-smoke.json voice-smoke.mp4
          test -s voice-smoke.mp4
          test -s voice-smoke.srt
          ffprobe -v error -show_entries stream=codec_type -of csv=p=0 voice-smoke.mp4 | grep -qx audio
