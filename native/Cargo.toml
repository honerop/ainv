[package]
name = "ainv-native"
version = "0.1.0"
edition = "2021"
description = "Native SVG scene rasterizer and H.264 MP4 codec backend for AinV"
license = "MIT"

[[bin]]
name = "ainv-native"
path = "src/main.rs"

[dependencies]
serde_json = "1.0"
resvg = "0.47"
openh264 = { version = "0.9.8", default-features = false, features = ["source"] }
mp4 = "0.14"
